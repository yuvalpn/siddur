    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --header-bg: #1e293b;
      --accent: #2563eb;
      --highlight: #fef08a;
      --highlight-text: #854d0e;
      --border: #e2e8f0;
      --font-size: 20px;
    }

    [data-theme="dark"] {

    body { background: var(--bg); color: var(--text); font-family: 'Frank Ruhl Libre', serif; line-height: 1.8; }

      font-family: 'Assistant', sans-serif;
    }

      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-family: 'Assistant', sans-serif;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .install-btn:hover { background: #15803d; }

      padding: 6px 16px; font-size: 0.85rem;
      font-family: 'Assistant', sans-serif;
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }
